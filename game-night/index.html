<style>
/* Layout: one-screen app. Home is a shelf of game boxes; play view is top bar + turn strip + stage. Felt-table green with warm wood accents. */
:root{
  --bg:#eaefe9; --surface:#ffffff; --surface-2:#f4f7f3; --ink:#18261f; --muted:#5a6b63; --line:#d3ddd5;
  --felt:#1f6f5c; --felt-ink:#ffffff; --felt-soft:#d7ebe3; --wood:#b87428; --wood-soft:#f3e3cc; --wood-dark:#7a4a17;
  --danger:#c0392b; --good:#2e8b57; --scrim:rgba(14,24,20,.55); --pass-bg:#123d33; --pass-ink:#f2f7f4;
  --p1:#d9523c; --p2:#2f6fb5; --p3:#d9a514; --p4:#2f9a5a; --p5:#8a5bc4; --p6:#d4609f;
  --cell:#ffffff; --cell-hi:#e7f2ec; --cell-sel:#c6e3d6;
  --board-light:#efd9b4; --board-dark:#a86f3c; --wood-ink:#fff;
  --font-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito Sans",ui-sans-serif,"Segoe UI",system-ui,-apple-system,sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#17221e; --surface-2:#1d2a25; --ink:#e4ede8; --muted:#93a59c; --line:#2b3a34;
  --felt:#3aae8e; --felt-ink:#07140f; --felt-soft:#1d3a31; --wood:#e0a052; --wood-soft:#3a2c1b; --wood-dark:#f0c58c;
  --danger:#ef6b5b; --good:#5cc489; --scrim:rgba(0,0,0,.65); --pass-bg:#0b2620; --pass-ink:#e9f3ee;
  --p1:#f0745f; --p2:#5b9be0; --p3:#ecc040; --p4:#4cc07c; --p5:#a983e0; --p6:#ea84bd;
  --cell:#1d2a25; --cell-hi:#22352e; --cell-sel:#2c4b40;
  --board-light:#d9bf93; --board-dark:#8e5a2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17221e; --surface-2:#1d2a25; --ink:#e4ede8; --muted:#93a59c; --line:#2b3a34;
  --felt:#3aae8e; --felt-ink:#07140f; --felt-soft:#1d3a31; --wood:#e0a052; --wood-soft:#3a2c1b; --wood-dark:#f0c58c;
  --danger:#ef6b5b; --good:#5cc489; --scrim:rgba(0,0,0,.65); --pass-bg:#0b2620; --pass-ink:#e9f3ee;
  --p1:#f0745f; --p2:#5b9be0; --p3:#ecc040; --p4:#4cc07c; --p5:#a983e0; --p6:#ea84bd;
  --cell:#1d2a25; --cell-hi:#22352e; --cell-sel:#2c4b40;
  --board-light:#d9bf93; --board-dark:#8e5a2e; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
#app{height:100%;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* Home */
.home{overflow-y:auto;padding-block:22px 40px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.home-inner{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:clamp(30px,7vw,46px);font-weight:800;line-height:1}
.brand h1 span{color:var(--felt)}
.brand p{margin:6px 0 0;color:var(--muted);max-width:44ch}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.box{position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;padding:14px 14px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0;transition:transform .12s ease, box-shadow .12s ease}
.box:hover{transform:translateY(-2px);box-shadow:0 6px 18px -10px rgba(0,0,0,.35)}
.box:active{transform:translateY(0)}
.box .art{width:100%;aspect-ratio:16/10;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.box .art svg{width:64%;height:80%}
.box .name{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.15}
.box .meta{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.box .box-open{position:absolute;inset:0;border:0;background:transparent;border-radius:inherit;padding:0;z-index:1}
.box .box-open:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
.box{cursor:pointer}
.box .box-help{position:absolute;right:8px;bottom:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);display:grid;place-items:center;padding:0}
.box .box-help svg{width:20px;height:20px}
.box .box-help:hover{background:var(--cell-sel)}
.box .box-fav{position:absolute;right:6px;top:6px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;opacity:.75}
.box .box-fav svg{width:24px;height:24px}
.box .box-fav[aria-pressed="true"]{color:#e8a317;opacity:1}
.box .box-fav[aria-pressed="true"] svg{fill:currentColor}
.box .box-fav:active{transform:scale(.88)}
.box .meta{padding-right:38px}
.search{position:relative}
.search .input{padding-left:40px;font-size:16px}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search-ic svg{width:20px;height:20px;display:block}
.shelf-empty{grid-column:1/-1;font-weight:700;text-align:center;padding:20px}
.foot{color:var(--muted);font-size:13px;max-width:60ch}

/* Play view */
.bar{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:var(--surface);border-bottom:1px solid var(--line)}
.bar h2{flex:1;min-width:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;height:40px;min-width:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.iconbtn svg{width:20px;height:20px}
.status{display:flex;align-items:center;gap:10px;min-height:46px;padding-block:8px;padding-left:var(--gut-l);padding-right:var(--gut-r);font-weight:800;font-size:15.5px}
.status .dot{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 3px var(--surface)}
.status .sub{margin-left:auto;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.stage{flex:1;min-height:0;overflow:auto;padding-block:4px 24px;padding-left:var(--gut-l);padding-right:var(--gut-r);display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 16px;font-weight:800;font-size:15px;min-height:44px}
.btn.primary{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}
.btn.wood{background:var(--wood);color:var(--wood-ink,#fff);border-color:var(--wood)}
.btn:disabled{opacity:.45;cursor:default}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{font-size:17px;padding:14px 22px}
.muted{color:var(--muted)}
.tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) var(--gut-r) max(20px,env(safe-area-inset-bottom,0px)) var(--gut-l);background:var(--scrim);animation:fade .15s ease}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.sheet h3{font-size:22px}
.sheet-body{display:flex;flex-direction:column;gap:12px}
.sheet-body p{margin:0}
.sheet-body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 12px;font-weight:700;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--felt-ink)}
.input{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;min-height:44px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names .nm{display:flex;align-items:center;gap:8px}
.names .nm i{flex:none;width:12px;height:12px;border-radius:50%}
.pass{background:var(--pass-bg);color:var(--pass-ink)}
.pass-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:380px}
.pass-card svg{width:84px;height:84px;opacity:.9}
.pass-eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.pass-name{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,10vw,52px);line-height:1;padding:4px 14px;border-radius:12px;background:rgba(255,255,255,.08)}
.pass-card p{margin:0;opacity:.85;max-width:32ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;animation:fade .15s ease;max-width:calc(100% - 32px);text-align:center}
/* People vs computer, rules, settings */
.names.with-cpu{grid-template-columns:1fr}
.names .nm.cpu .input{opacity:.75}
.who-btn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:0 10px;min-height:44px;font-weight:800;font-size:13px;min-width:116px;justify-content:center}
.who-btn svg{width:20px;height:20px}
.who-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet-body .aka{font-size:14px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.linkbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;font-weight:800;color:var(--felt);text-decoration:underline;text-underline-offset:3px}
.linkbtn svg{width:18px;height:18px}
.status .dot.bot{width:24px;height:24px;display:grid;place-items:center;color:#fff;animation:think 1.2s ease-in-out infinite}
.status .dot.bot svg{width:16px;height:16px;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
@keyframes think{50%{transform:translateY(-2px) rotate(-6deg)}}
.stage.cpu-turn>*{pointer-events:none}
.rules-btn span{font-size:14px}
@media (max-width:360px){.rules-btn span{display:none}}
.pass-rules{background:transparent;color:inherit;border-color:currentColor;opacity:.8}
.skin-list{display:flex;flex-direction:column;gap:8px}
.skin-opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:56px}
.skin-opt[aria-checked="true"]{box-shadow:0 0 0 3px var(--felt);border-color:var(--felt)}
.skin-sw{flex:none;display:grid;grid-template-columns:1fr 1fr;width:40px;height:40px;border-radius:9px;overflow:hidden;border:1px solid rgba(0,0,0,.2)}
.skin-sw i{display:block}
.skin-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.skin-txt b{font-family:var(--font-display);font-size:16px}
.skin-txt small{color:var(--muted);font-size:13px;line-height:1.3}
.brand{align-items:flex-start;flex-wrap:nowrap}
.brand>div{flex:1;min-width:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style>
/* ===== Looks (skins). Chosen in Settings; stored as data-skin on <html>. Classic = no attribute. ===== */

/* ---------- Toy Box ---------- */
:root[data-skin="toybox"]{
  --bg:#fff4dc; --surface:#ffffff; --surface-2:#fff1d1; --ink:#141414; --muted:#4b4740; --line:#141414;
  --felt:#2f5bea; --felt-ink:#ffffff; --felt-soft:#d9e2ff; --wood:#ef4b3a; --wood-soft:#ffe1ad; --wood-dark:#141414; --wood-ink:#ffffff;
  --danger:#d42f22; --good:#14935a; --scrim:rgba(20,20,20,.6); --pass-bg:#2f5bea; --pass-ink:#ffffff;
  --p1:#ef4b3a; --p2:#2f5bea; --p3:#f6c33b; --p4:#2fb57c; --p5:#9b5de5; --p6:#ff6fae;
  --cell:#ffffff; --cell-hi:#fff0c2; --cell-sel:#ffd966;
  --board-light:#fff4dc; --board-dark:#f2b33d;
  --font-display:"Bowlby One",Impact,"Arial Black",sans-serif; --font-body:Rubik,ui-rounded,system-ui,sans-serif;
  color-scheme:light}

[data-skin="toybox"] h1,[data-skin="toybox"] h2,[data-skin="toybox"] h3{font-weight:400;letter-spacing:.01em}
[data-skin="toybox"] .brand h1{color:#fff;-webkit-text-stroke:2px #141414;paint-order:stroke fill;text-shadow:4px 4px 0 #141414;font-weight:400}

[data-skin="toybox"] .brand p{color:#fff;font-weight:700}
[data-skin="toybox"] .box,[data-skin="toybox"] .btn,[data-skin="toybox"] .chip,[data-skin="toybox"] .iconbtn,[data-skin="toybox"] .seg button,[data-skin="toybox"] .input,[data-skin="toybox"] .pc-seat,[data-skin="toybox"] .who-btn,[data-skin="toybox"] .skin-opt{border:3px solid #141414;box-shadow:3px 3px 0 #141414;font-weight:800}
[data-skin="toybox"] .box{border-radius:16px;box-shadow:5px 5px 0 #141414}

[data-skin="toybox"] .box:nth-child(4n+1) .art{background:#f6c33b}
[data-skin="toybox"] .box:nth-child(4n+2) .art{background:#ffb4a8}
[data-skin="toybox"] .box:nth-child(4n+3) .art{background:#b9cbff}
[data-skin="toybox"] .box:nth-child(4n+4) .art{background:#a6eccd}
[data-skin="toybox"] .box .name{font-family:var(--font-display);font-weight:400;font-size:16px}
[data-skin="toybox"] .btn:active,[data-skin="toybox"] .iconbtn:active,[data-skin="toybox"] .chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #141414}
[data-skin="toybox"] .btn.primary{background:#2f5bea;color:#fff;border-color:#141414}
[data-skin="toybox"] .btn.wood{background:#ef4b3a;color:#fff;border-color:#141414}
[data-skin="toybox"] .chip[aria-pressed="true"],[data-skin="toybox"] .seg button[aria-pressed="true"]{background:#f6c33b;color:#141414;border-color:#141414}
[data-skin="toybox"] .who-btn[aria-pressed="true"]{background:#141414;color:#fff}
[data-skin="toybox"] .bar{background:#2f5bea;border-bottom:3px solid #141414}
[data-skin="toybox"] .bar h2{color:#fff;-webkit-text-stroke:1.5px #141414;paint-order:stroke fill;text-shadow:3px 3px 0 #141414;font-size:22px}
[data-skin="toybox"] .bar .iconbtn{background:#fff}
[data-skin="toybox"] .bar .rules-btn{background:#f6c33b}
[data-skin="toybox"] .sheet{border:3px solid #141414;box-shadow:7px 7px 0 #141414;border-radius:18px}
[data-skin="toybox"] .pc-felt,[data-skin="toybox"] .tr-table{border:3px solid #141414;box-shadow:5px 5px 0 #141414}
[data-skin="toybox"] .pc-hand,[data-skin="toybox"] .tr-rack,[data-skin="toybox"] .wt-rack,[data-skin="toybox"] .pk-me{border:3px solid #141414;box-shadow:5px 5px 0 #141414}
[data-skin="toybox"] .status{font-weight:800}
[data-skin="toybox"] .status .dot{border:2px solid #141414}
[data-skin="toybox"] .pass-name{background:#fff;border:3px solid #141414;box-shadow:4px 4px 0 #141414}
[data-skin="toybox"] .toast{border:3px solid #141414;background:#f6c33b;color:#141414;box-shadow:4px 4px 0 #141414}

/* ---------- Night Arcade ---------- */
:root[data-skin="arcade"]{
  --bg:#120a2e; --surface:#1c1245; --surface-2:#251858; --ink:#f1ecff; --muted:#aea4dc; --line:#3f3184;
  --felt:#24e0f0; --felt-ink:#07041a; --felt-soft:#173c55; --wood:#ff3fa4; --wood-soft:#3a1846; --wood-dark:#8a1d5c; --wood-ink:#ffffff;
  --danger:#ff5470; --good:#b6ff3b; --scrim:rgba(5,2,20,.78); --pass-bg:#0b0620; --pass-ink:#f1ecff;
  --p1:#ff3fa4; --p2:#24e0f0; --p3:#ffc83b; --p4:#b6ff3b; --p5:#a77bff; --p6:#ff8a3b;
  --cell:#1f1550; --cell-hi:#2a1d66; --cell-sel:#40308f;
  --board-light:#d4ccff; --board-dark:#7a62e0;
  --font-display:Silkscreen,"Courier New",monospace; --font-body:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark}
[data-skin="arcade"] body{background-image:linear-gradient(rgba(122,98,224,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(122,98,224,.16) 1px,transparent 1px);background-size:24px 24px}
[data-skin="arcade"] h1,[data-skin="arcade"] h2,[data-skin="arcade"] h3{font-weight:700;letter-spacing:.02em}
[data-skin="arcade"] .brand h1{color:#fff;text-shadow:0 0 6px #ff3fa4,0 0 18px #ff3fa4}
[data-skin="arcade"] .brand h1 span{color:#24e0f0;text-shadow:0 0 6px #24e0f0,0 0 18px #24e0f0}
[data-skin="arcade"] .box{background:rgba(28,18,69,.85);border:1.5px solid var(--glow,#24e0f0);border-radius:6px;box-shadow:0 0 12px -2px var(--glow,#24e0f0),inset 0 0 18px -10px var(--glow,#24e0f0)}
[data-skin="arcade"] .box:nth-child(4n+1){--glow:#24e0f0}[data-skin="arcade"] .box:nth-child(4n+2){--glow:#ff3fa4}[data-skin="arcade"] .box:nth-child(4n+3){--glow:#b6ff3b}[data-skin="arcade"] .box:nth-child(4n+4){--glow:#ffc83b}

    function pass() {

      api.over(`${P[w].name} wins`, `Black (${P[0].name}): <b>${sc[0]}</b><br>White (${P[1].name}): <b>${sc[1]}</b> including 6.5 komi.`);
    }
    async function resign() {

      const who = P[turn];
      const ok = await api.modal({ title: `${who.name} resigns?`, body: null, actions: [{ label: 'Cancel', value: false }, { label: 'Resign', value: true, primary: true }] });

    }
    function undo() {

    const kick = () => { if (phase === 'play' && !done) api.turnOf(P[turn], aiMove, 500); };
    // ---- computer player: a friendly heuristic player (captures, saves groups, avoids self-atari, keeps eyes)

      let passesP = 0, moves = 0; const maxM = N * N * 2.5;

        for (let j = empties.length - 1; j >= 0; j--) {

          // skip own eyes
          let eye = true; for (const y of NB[i]) if (bd[y] !== p) { eye = false; break; }
          if (eye) continue;
          bd[i] = p; let cap = false;
          for (const y of NB[i]) if (bd[y] === 1 - p && libsOf(bd, y, 1) === 0) { removeGroup(bd, y, empties, pos); cap = true; }
          if (!cap && libsOf(bd, i, 1) === 0) { bd[i] = -1; continue; }

      for (let i = 0; i < N * N; i++) { let o = bd[i]; if (o === -1) { const n0 = NB[i].every(y => bd[y] === 0), n1 = NB[i].every(y => bd[y] === 1); o = n0 ? 0 : n1 ? 1 : -1; } if (o === 0) sc++; else if (o === 1) sc--; }

    }
    async function aiMove() {

      if (level === 0) {

      }

      const budget = Math.min(({ 9: [0, 700, 2200], 13: [0, 1000, 2800], 19: [0, 1200, 3500] }[N] || [0, 900, 2500])[level], cpuDelay() * 300);
      const t0 = performance.now(); let total = 0;

        const tc = performance.now();
        while (performance.now() - tc < 30) {

          const win = playout(bc.r.bd.slice(), 1 - p) === p;

        window.__goStats = { total, ms: performance.now() - t0 };

      }
      const best = cands.reduce((a, c) => (c.n > a.n || (c.n === a.n && c.w > a.w) ? c : a), cands[0]);

});
