<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73; --line:#e3e1dc; --track:#ecebe7;
  --accent:#2f7d5b; --accent-ink:#ffffff; --danger:#c0392b; --chip:#eef4f0; --warn:#b45309;
  --kcal:#c2410c; --p:#2563eb; --c:#a16207; --f:#9333ea;
  --cp:#2563eb; --cc:#a16207; --cf:#9333ea; --grid:#e8e6e1;
}
/* Dark mode is opt-in (Settings > Appearance); light is the default. */
:root[data-theme="dark"]{ color-scheme:dark;
    --bg:#111113; --card:#1c1c1f; --text:#f2f2f4; --muted:#9a9aa0; --line:#2e2e33; --track:#2a2a2f;
    --accent:#4fb588; --accent-ink:#0b1a13; --danger:#ef6b5b; --chip:#1f2a24; --warn:#f59e0b;
    --kcal:#fb923c; --p:#60a5fa; --c:#facc15; --f:#c084fc;
    --cp:#3b82f6; --cc:#c27c0e; --cf:#a855f7; --grid:#2c2c31;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
header .row{display:flex;align-items:center;gap:8px}
header h1{font-size:22px;margin:0;flex:1}
main{padding:12px 16px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 0 10px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button .ico{display:block;font-size:20px;line-height:1.25}
nav.tabs button.on{color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 10px}
.btn.soft{background:var(--chip);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.search{margin-bottom:12px}
.list{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.item:last-child{border-bottom:0}
.item .name{font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.grow{flex:1;min-width:0}
.chev{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.macros div b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.macros div small{font-size:12px;color:var(--muted)}
.k b{color:var(--kcal)} .p b{color:var(--p)} .c b{color:var(--c)} .fa b{color:var(--f)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:8px;font-size:14px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.days{display:flex;gap:4px;margin-bottom:12px}
.days button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 0;font-size:13px}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.days button .dot{display:block;height:5px;width:5px;border-radius:50%;margin:2px auto 0;background:currentColor;opacity:0}
.days button.has .dot{opacity:.7}
.line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.pline{display:flex;align-items:center;gap:10px;width:100%;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pline:last-of-type{border-bottom:0}
.pline .pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pline .pqty{flex:none;font-size:14px;color:var(--accent);background:var(--chip);border-radius:999px;padding:4px 10px;font-weight:600;white-space:nowrap}
.line input.qty{width:72px;text-align:right;padding:10px 8px}
.line select.unit{width:86px;padding:10px 4px}
.line.wrap{flex-wrap:wrap;row-gap:6px}
.line.wrap>.grow{flex-basis:100%}
.line.wrap input.qty{flex:1;max-width:120px}
.line.wrap select.unit{flex:1;width:auto}
.brand{font-weight:400;color:var(--muted);font-size:.92em}
.brand::before{content:"· "}
.tag{font-size:11px;background:var(--chip);color:var(--accent);border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:600;vertical-align:middle}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--danger);font-size:14px;margin:8px 0}
.warn{color:var(--warn);font-size:13px}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:88vh;background:var(--bg);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
dialog .dh b{flex:1}
dialog .db{padding:12px 14px;overflow:auto;max-height:76vh}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-bottom:10px}
.thumbs img,.thumbs .addph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--track);display:block;border:0}
.thumbs .addph{display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--accent);font-size:13px;border:1.5px dashed var(--accent);background:var(--chip)}
textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:84px;resize:vertical}
.chart svg{width:100%;display:block;overflow:visible}
.chart .tip{min-height:20px;font-size:13px;color:var(--text);margin-top:4px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dots7{display:flex;gap:6px}
.dots7 div{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.dots7 b{display:block;margin:4px auto 0;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);line-height:24px;color:var(--accent-ink);font-size:15px}
.dots7 b.on{background:var(--accent);border-color:var(--accent)}
.dots7 .today{color:var(--text);font-weight:700}
table.mini{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.mini th,table.mini td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line)}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{color:var(--muted);font-weight:600}
.exrow{display:flex;align-items:center;gap:12px;font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;border-radius:10px;aspect-ratio:3/4;object-fit:cover;background:var(--track)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.nowrap{white-space:nowrap}
/* gauges */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.gauge{text-align:center;position:relative}
.gauge svg{width:100%;max-width:170px;display:block;margin:0 auto}
.gauge .val{position:absolute;left:0;right:0;top:44%;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.gauge .of{font-size:12px;color:var(--muted);margin-top:-4px}
.gauge .lbl{font-size:13px;font-weight:600;margin-top:2px}
.gauge.over .val{color:var(--danger)}
.convbar{display:flex;gap:8px;margin-bottom:14px}
.convbar button{flex:1}
.bigres{font-size:28px;font-weight:700;text-align:center;padding:12px 0 2px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:14px}
.gitem{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gitem.have .name{text-decoration:line-through;color:var(--muted)}
.scanbox{border:1px dashed var(--accent);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--chip)}
details summary{cursor:pointer;color:var(--accent);font-size:14px;margin:4px 0}
pre.ocr{white-space:pre-wrap;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:200px;overflow:auto}
</style>

<body>
<header><div class="row"><h1 id="title">Home</h1><span id="hdrBtn"></span></div></header>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="home"><span class="ico">🏠</span>Home</button>
  <button data-tab="recipes"><span class="ico">🍲</span>Recipes</button>
  <button data-tab="ingredients"><span class="ico">🥕</span>Ingredients</button>
  <button data-tab="progress"><span class="ico">📈</span>Progress</button>
  <button data-tab="grocery"><span class="ico">🛒</span>Groceries</button>
  <button data-tab="settings"><span class="ico">⚙️</span>Settings</button>
</nav>

<dialog id="picker"><div class="dh"><b>Add to recipe</b><button class="btn ghost" data-close>Close</button></div>
  <div class="db"><div class="seg" id="pickSeg"><button data-k="ing" class="on">Ingredients</button><button data-k="rec">Recipes</button></div>
  <input class="search" id="pickSearch" placeholder="Search" autocomplete="off"><div class="list" id="pickList"></div></div></dialog>
<dialog id="dlg"><div class="dh"><b id="dlgTitle"></b><button class="btn ghost" data-close>Close</button></div><div class="db" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   Units
   ========================================================= */
// t: m = mass (factor in grams), v = volume (factor in ml), p = count
const UNITS = {
  g:{t:"m",f:1,l:"g"}, kg:{t:"m",f:1000,l:"kg"}, mg:{t:"m",f:0.001,l:"mg"},
  oz:{t:"m",f:28.349523,l:"oz"}, lb:{t:"m",f:453.59237,l:"lb"},
  tsp:{t:"v",f:4.928922,l:"tsp"}, tbsp:{t:"v",f:14.786765,l:"tbsp"}, floz:{t:"v",f:29.57353,l:"fl oz"},
  cup:{t:"v",f:236.5882,l:"cup"}, pint:{t:"v",f:473.1765,l:"pint"}, quart:{t:"v",f:946.3529,l:"quart"},
  gallon:{t:"v",f:3785.412,l:"gallon"}, ml:{t:"v",f:1,l:"ml"}, l:{t:"v",f:1000,l:"L"},
  piece:{t:"p",f:1,l:"piece"}
};
const MASS = ["g","oz","lb","kg","mg"], VOL = ["tsp","tbsp","cup","floz","pint","quart","gallon","ml","l"];
const CUP = UNITS.cup.f;
const FRAC = {"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875,"⅙":1/6,"⅚":5/6,"⅕":.2};
// Parses "2", "1.5", "1,5", "1/4", "1 1/2", "1-1/2", "1½", "½"
function parseQty(s){
  if(typeof s==="number") return s;
  s=String(s??"").trim().replace(",", ".");
  if(!s) return NaN;
  let extra=0;
  s=s.replace(/[¼½¾⅓⅔⅛⅜⅝⅞⅙⅚⅕]/g, m=>{ extra+=FRAC[m]; return " "; }).trim();
  if(!s) return extra;
  let m;
  if((m=s.match(/^(\d+(?:\.\d+)?)$/))) return +m[1]+extra;
  if((m=s.match(/^(\d+)\s*\/\s*(\d+)$/))) return +m[2] ? m[1]/m[2]+extra : NaN;
  if((m=s.match(/^(\d+)[\s-]+(\d+)\s*\/\s*(\d+)$/))) return +m[3] ? +m[1]+m[2]/m[3]+extra : NaN;
  return NaN;
}
// Nice display: 0.25 cup -> "¼", 1.5 -> "1 ½" for kitchen units; decimals otherwise
const NICE = [[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[2/3,"⅔"],[.75,"¾"],[.875,"⅞"],[1,""]];
function fmtQty(n, unit){
  if(!isFinite(n)) return "–";
  const kitchen = ["tsp","tbsp","cup","pint","quart","gallon","piece"].includes(unit);
  if(kitchen && n>0 && n<50){
    const w=Math.floor(n), fr=n-w;
    let best=NICE[0]; for(const c of NICE) if(Math.abs(fr-c[0])<Math.abs(fr-best[0])) best=c;
    if(Math.abs(fr-best[0]) <= 0.02*Math.max(n,1) + 0.01){
      const whole = best[0]===1 ? w+1 : w;
      if(whole===0 && best[1]) return best[1];
      return best[1] ? `${whole} ${best[1]}` : String(whole);
    }
  }
  const d = n>=100?0 : n>=10?1 : 2;
  return fmt(n,d);
}
const unitLabel = (u, n=1) => {
  const l=UNITS[u]?.l||u;
  if(n<=1 || ["g","kg","mg","oz","lb","ml","L","tsp","tbsp","fl oz"].includes(l)) return l;
  return l==="piece"?"pieces" : l+"s";
};
function unitOptions(list, sel){
  const groups = {m:"Weight", v:"Volume", p:"Count", r:"Recipe"};
  let html="", cur=null;
  for(const u of list){
    const t = u==="serving"||u==="batch" ? "r" : UNITS[u].t;
    if(t!==cur){ if(cur) html+="</optgroup>"; html+=`<optgroup label="${groups[t]}">`; cur=t; }
    const lab = u==="serving"?"serving": u==="batch"?"batch" : UNITS[u].l;
    html+=`<option value="${u}" ${u===sel?"selected":""}>${lab}</option>`;
  }
  return html+"</optgroup>";
}
// grams in 1 unit of `u` for ingredient `x` (null when it can't be converted)
function gramsPerUnit(x, u){
  const U=UNITS[u]; if(!U) return null;
  if(U.t==="m") return U.f;
  if(U.t==="v") return x && x.gPerMl ? U.f*x.gPerMl : null;
  return x && x.gPerPiece ? x.gPerPiece : null;
}
const unitsFor = x => [...MASS, ...(x&&x.gPerMl?VOL:[]), ...(x&&x.gPerPiece?["piece"]:[])];

/* =========================================================
   Data
   ========================================================= */
// Ingredient: {id, name, per:{kcal,protein,carbs,fat} PER GRAM, gPerMl?, gPerPiece?, serving:{qty,unit,grams}}
// Recipe: {id, name, servings, finalWeight, items:[{kind:'ing'|'rec', id, qty, unit}]}
// Plan: {goals:{kcal,protein,carbs,fat} per day, entries:[{id, recipeId, servings, day 0=Mon..6=Sun}], have:{ingId:true}, extra:[{id,text,have}]}
const KEY="macro-kitchen-v1";
let db=load();
function load(){
  let d=null;
  try{ const s=localStorage.getItem(KEY); if(s) d=JSON.parse(s); }catch(e){}
  if(!d || !Array.isArray(d.ingredients) || !Array.isArray(d.recipes)) d={ingredients:[],recipes:[]};
  return migrate(d);
}
function migrate(d){
  for(const x of d.ingredients){ if(!x.serving) x.serving={qty:"100",unit:"g",grams:100}; }
  for(const r of d.recipes) for(const it of r.items){ if(!it.unit) it.unit = it.kind==="ing"?"g":"serving"; }
  if(!d.plan) d.plan={};
  d.plan.goals = Object.assign({kcal:2000,protein:120,carbs:225,fat:65}, d.plan.goals||{});
  d.plan.entries = d.plan.entries||[]; d.plan.have=d.plan.have||{}; d.plan.extra=d.plan.extra||[]; d.plan.saved=d.plan.saved||[]; d.plan.recent=d.plan.recent||[];
  d.body=Object.assign({unit:"lb", weights:[], checkinDay:null, progress:[]}, d.body||{});
  d.log=d.log||{}; for(const v of Object.values(d.log)) if(v.ex===true) v.ex=2;
  return d;
}
// Each day, the planned meals for today's weekday are recorded under today's date, so charts have real dated history.
function snapToday(){ if(typeof todayIdx!=="function"||!db.log) return; const d=isoDay(), m=zero();
  db.plan.entries.filter(e=>e.day===todayIdx()).forEach(e=>add(m,entryMacros(e)));
  const e=db.log[d]||{};
  if(m.kcal>0) e.m={kcal:Math.round(m.kcal),protein:Math.round(m.protein),carbs:Math.round(m.carbs),fat:Math.round(m.fat)}; else delete e.m;
  if(Object.keys(e).length) db.log[d]=e; else delete db.log[d]; }
function save(){ try{ snapToday(); localStorage.setItem(KEY, JSON.stringify(db)); localStorage.setItem(KEY+"-changed", Date.now()); }catch(e){ toast("Could not save on this device"); } }
/* ---------- Backups: data lives in this home-screen app; deleting the icon deletes it, so keep a file copy ---------- */
const getNum=k=>{ try{ return +localStorage.getItem(KEY+k)||0; }catch(e){ return 0; } };
const hasData=()=>db.ingredients.length+db.recipes.length>0;
function backupDue(){ if(!hasData()) return false; const last=getNum("-backup"); return !last || (getNum("-changed")>last && Date.now()-last>3*864e5); }
/* ---------- Photos: compressed JPEGs kept in IndexedDB on the device (too big for normal storage) ---------- */
let _pdb=null;
function idb(){ return _pdb||(_pdb=new Promise((res,rej)=>{ const r=indexedDB.open("macro-kitchen-photos",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"}); r.onsuccess=()=>res(r.result); r.onerror=()=>{ _pdb=null; rej(r.error); }; })); }
async function pstore(mode, fn){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction("photos",mode); const rq=fn(tx.objectStore("photos"));
  tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); }); }
const putPhoto=(id,blob)=>pstore("readwrite",st=>st.put({id,blob}));
const getPhoto=id=>pstore("readonly",st=>st.get(id)).then(r=>r&&r.blob);
const delPhoto=id=>{ urlCache.delete(id); return pstore("readwrite",st=>st.delete(id)).catch(()=>{}); };
const allPhotos=()=>pstore("readonly",st=>st.getAll());
const urlCache=new Map();
async function photoURL(id){ if(urlCache.has(id)) return urlCache.get(id); const b=await getPhoto(id); if(!b) return ""; const u=URL.createObjectURL(b); urlCache.set(id,u); return u; }
async function compressPhoto(file, max=1280){
  const img=await createImageBitmap(file,{imageOrientation:"from-image"}).catch(async()=>{ const i=new Image(); i.src=URL.createObjectURL(file); await i.decode(); return i; });
  const sc=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
  c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,"image/jpeg",0.72));
}

/* ---------- Cycle guard ---------- */
function uses(fromId, targetId, seen=new Set()){
  if(fromId===targetId) return true;
  if(seen.has(fromId)) return false; seen.add(fromId);
  const r=rec(fromId); if(!r) return false;
  return r.items.some(it=>it.kind==="rec" && uses(it.id, targetId, seen));
}
const canNest=(parentId, childId)=>!uses(childId, parentId);

/* ---------- Totals ---------- */
// For an item: {m: macros, grams, frac (sub-recipe share of a batch), bad: unconvertible/missing}
function itemInfo(it, stack=[]){
  const q=parseQty(it.qty); const qq=isNaN(q)?0:q;
  if(it.kind==="ing"){
    const x=ing(it.id); if(!x) return {m:zero(),grams:0,bad:"missing"};
    const gpu=gramsPerUnit(x,it.unit); if(gpu==null) return {m:zero(),grams:0,bad:"unit"};
    const g=qq*gpu; return {m:add(zero(),x.per,g), grams:g};
  }
  const sr=rec(it.id); if(!sr) return {m:zero(),grams:0,bad:"missing"};
  const sub=totals(it.id, stack); let frac;
  if(it.unit==="serving") frac=qq/(Number(sr.servings)||1);
  else if(it.unit==="batch") frac=qq;
  else { const g=qq*(UNITS[it.unit]?.f||1); frac=sub.weight? g/sub.weight : 0; }
  return {m:add(zero(),sub.total,frac), grams:frac*sub.weight, frac, bad: sub.bad};
}
function totals(id, stack=[]){
  const r=rec(id); if(!r || stack.includes(id)) return {total:zero(),weight:0,rawWeight:0,bad:"missing"};
  const t=zero(); let w=0, bad=null;
  for(const it of r.items){ const i=itemInfo(it, stack.concat(id)); add(t,i.m); w+=i.grams; if(i.bad) bad=i.bad; }
  const fw=Number(r.finalWeight)||0;
  return {total:t, weight: fw>0?fw:w, rawWeight:w, bad};
}
// Flattens a recipe into raw ingredient grams. factor = number of batches.
function flatten(id, factor, acc, stack=[]){
  const r=rec(id); if(!r || stack.includes(id)) return acc;
  for(const it of r.items){
    if(it.kind==="ing"){ const i=itemInfo(it); if(ing(it.id)) acc[it.id]=(acc[it.id]||0)+i.grams*factor; if(i.bad==="unit") acc._bad=true; }
    else { const i=itemInfo(it, stack.concat(id)); if(i.frac) flatten(it.id, factor*i.frac, acc, stack.concat(id)); }
  }
  return acc;
}

/* ---------- Costs (optional price per package on each ingredient) ---------- */
const money=n=>"$"+(Math.round(n*100)/100).toFixed(2);
function costPerGram(x){ if(!x||!x.price) return null; const g=gramsPerUnit(x,x.price.unit); const q=parseQty(x.price.qty);
  return g&&q>0 ? x.price.amount/(q*g) : null; }
// Cost of ingredient grams map -> {total, priced, missing:[names]}
function costOf(acc){ let total=0, priced=0; const missing=[];
  for(const [id,g] of Object.entries(acc)){ if(id[0]==="_"||!(g>0)) continue; const x=ing(id); if(!x) continue; const c=costPerGram(x);
    if(c==null) missing.push(ingLabel(x)); else { total+=c*g; priced++; } }
  return {total, priced, missing}; }
const priceText=x=>x.price?`${money(x.price.amount)} / ${x.price.qty} ${unitLabel(x.price.unit, parseQty(x.price.qty))}`:"";
function bestAmount(x, grams){
  const parts=[`${fmt(grams)} g`];
  const su=x.serving?.unit;
  if(su && UNITS[su].t==="v" && x.gPerMl){
    const ml=grams/x.gPerMl; const u = ml>=CUP/4 ? (ml>=4*CUP*4 ? "quart" : "cup") : ml>=UNITS.tbsp.f ? "tbsp" : "tsp";
    parts.unshift(`${fmtQty(ml/UNITS[u].f,u)} ${unitLabel(u, ml/UNITS[u].f)}`);
  } else if(su==="piece" && x.gPerPiece){
    const n=grams/x.gPerPiece; parts.unshift(`${fmtQty(Math.ceil(n*4-0.01)/4,"piece")} ${unitLabel("piece",n)}`);
  } else if(grams>=454) parts.push(`${fmt(grams/UNITS.lb.f,2)} lb`);
  else parts.push(`${fmt(grams/UNITS.oz.f,1)} oz`);
  return parts.join(" · ");
}
function groceryData(){
  const acc={};
  for(const e of db.plan.entries){
    if(isSnack(e)){ if(ing(e.ingId)){ const i=itemInfo({kind:"ing",id:e.ingId,qty:e.qty,unit:e.unit}); acc[e.ingId]=(acc[e.ingId]||0)+i.grams; if(i.bad) acc._bad=true; } continue; }
    const r=rec(e.recipeId); if(!r) continue;
    flatten(r.id, (Number(e.servings)||0)/(Number(r.servings)||1), acc); }
  const bad=acc._bad; delete acc._bad;
  return {items:Object.entries(acc).filter(([,g])=>g>0).map(([id,g])=>({x:ing(id), g})).filter(o=>o.x).sort((a,b)=>byName(a.x,b.x)), bad};
}

async function shareGrocery(){
  const {items}=groceryData(); const P=db.plan;

}

      price={amount:amt, qty:pq, unit:pu}; }

  };

  };
}

/* ---------- Label scanning (on-device OCR, works offline) ---------- */
let ocrWorker=null;
// The label reader (tesseract.js) is embedded in this file as base64 blocks at the end of <body>,
// so scanning works offline and even when the .html file is opened directly (no server needed).
const embedded=id=>{ const el=document.getElementById(id); if(!el) throw new Error("missing "+id);
  const s=atob(el.textContent.trim()); const a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; };
const blobUrl=(id,type)=>URL.createObjectURL(new Blob([embedded(id)],{type}));
async function getWorker(status){
  if(ocrWorker) return ocrWorker;
  status("Starting the label reader…");
  if(!window.Tesseract){ const s=document.createElement("script"); s.src=blobUrl("ocr-main","text/javascript");
    await new Promise((res,rej)=>{ s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
  // Core, language data and worker go in one blob. When the page is opened as a file, a worker can't
  // load anything else, so the worker's fetch of the language file is answered from memory.
  const prelude=`(()=>{const b64=${JSON.stringify(document.getElementById("ocr-eng").textContent.trim())};
    const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
    const f=self.fetch;self.fetch=(u,...r)=>String(u).endsWith("eng.traineddata.gz")?Promise.resolve(new Response(a)):f(u,...r);})();\n`;
  const wurl=URL.createObjectURL(new Blob([prelude, embedded("ocr-core"), "\n;\n", embedded("ocr-worker")],{type:"text/javascript"}));
  const start=Tesseract.createWorker("eng", 1, {workerPath:wurl, workerBlobURL:false, langPath:"https://local.invalid/lang", gzip:true, cacheMethod:"none",
    logger:m=>{ if(m.status==="recognizing text") status(`Reading label… ${Math.round(m.progress*100)}%`); }});
  ocrWorker=await Promise.race([start, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timed out")),90000))]);
  return ocrWorker;
}
async function prepImage(file){
  const img = await createImageBitmap(file, {imageOrientation:"from-image"}).catch(async()=>{
    const u=URL.createObjectURL(file); const i=new Image(); i.src=u; await i.decode(); return i; });
  const w=img.width, h=img.height, scale=Math.min(2.5, 2200/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  const g=c.getContext("2d"); g.drawImage(img,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height), p=d.data;
  for(let i=0;i<p.length;i+=4){ const y=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]; const v=Math.max(0,Math.min(255,(y-128)*1.5+128)); p[i]=p[i+1]=p[i+2]=v; }
  g.putImageData(d,0,0); return c;
}
/* ---------- Barcode: decode on the phone, then look up Open Food Facts (free product database) ---------- */
let zxingReady=null;
async function getZXing(){
  if(!zxingReady) zxingReady=(async()=>{
    if(!window.ZXingWASM){ const s=document.createElement("script"); s.src=blobUrl("bc-main","text/javascript");
      await new Promise((res,rej)=>{ s.onload=res; s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); }); }
    const wasm=embedded("bc-wasm");
    ZXingWASM.prepareZXingModule({overrides:{wasmBinary:wasm.buffer, locateFile:(p,pre)=>pre+p}, fireImmediately:true});
    return ZXingWASM; })().catch(e=>{ zxingReady=null; throw e; });
  return zxingReady;
}
async function scanBarcode(file, curId){
  const st=$("#scanStatus"); st.textContent="Reading barcode…";
  try{
    const Z=await getZXing();
    let res=await Z.readBarcodes(file,{tryHarder:true, formats:["EAN13","EAN8","UPCA","UPCE"], maxNumberOfSymbols:1});
    if(!res.length){ const c=await prepImage(file); const ctx=c.getContext("2d");
      res=await Z.readBarcodes(ctx.getImageData(0,0,c.width,c.height),{tryHarder:true, formats:["EAN13","EAN8","UPCA","UPCE"], maxNumberOfSymbols:1}); }
    if(!res.length){ $("#bcManual").hidden=false; st.textContent="Couldn't read the barcode. Try a closer, sharper photo, or type the number under the bars."; return; }
    lookupBarcode(res[0].text, curId);
  }catch(e){ console.error(e); $("#bcManual").hidden=false; st.textContent="The barcode reader couldn't start here. You can type the number instead."; }
}
async function lookupBarcode(code, curId){
  const st=$("#scanStatus");
  if(!/^\d{6,14}$/.test(code)){ $("#bcManual").hidden=false; st.textContent="That doesn't look like a barcode number."; return; }
  $("#bcCode").value=code;
  const mine=db.ingredients.find(o=>o.barcode===code && o.id!==curId);
  if(mine){ st.innerHTML=`You already have this one: <b>${esc(ingLabel(mine))}</b>. <button class="btn ghost small" id="bcOpen">Open it</button>`; $("#bcOpen").onclick=()=>go({tab:"ingredients",id:mine.id}); return; }
  if(!navigator.onLine){ st.textContent=`Barcode ${code} read, but looking it up needs internet. Try again online, or use Scan label.`; return; }
  st.textContent=`Looking up ${code}…`;
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_en,brands,nutriments,serving_size,serving_quantity`);
    const d=await r.json();
    if(d.status!==1||!d.product){ $("#bcManual").hidden=false; st.textContent=`Barcode ${code} isn't in the free product database yet. Use Scan label instead.`; $("#bcVal").value=code; return; }
    const P=d.product, n=P.nutriments||{};
    const kcal = n["energy-kcal_100g"] ?? (n["energy_100g"]!=null ? n["energy_100g"]/4.184 : null);
    const name=(P.product_name_en||P.product_name||"").trim(), brand=(P.brands||"").split(",")[0].trim();
    if(name && !$("#nm").value.trim()) $("#nm").value=name;
    if(brand && !$("#br").value.trim()) $("#br").value=brand;
    $("#sq").value="100"; $("#su").value="g"; $("#su").onchange();
    const vals={kcal, protein:n.proteins_100g, carbs:n.carbohydrates_100g, fat:n.fat_100g}; const got=[];
    for(const k of MAC) if(vals[k]!=null && !isNaN(vals[k])){ $("#"+k).value=+(+vals[k]).toFixed(k==="kcal"?0:2); got.push(MACNAME[k].toLowerCase()); }
    $("#bcVal").value=code;
    st.innerHTML = got.length ? `Found <b>${esc([name,brand].filter(Boolean).join(" · ")||code)}</b>. Filled in ${got.join(", ")} per 100 g${P.serving_size?` (one serving is ${esc(P.serving_size)})`:""}. <b>Please check against the package.</b>`
      : `Found ${esc(name||code)}, but it has no nutrition numbers. Use Scan label instead.`;
  }catch(e){ console.error(e); st.textContent="Couldn't reach the product database. Check your connection, or use Scan label."; }
}
async function scanLabel(file){
  const st=$("#scanStatus"); const status=t=>{ st.textContent=t; };
  const btn=$("#scan"); btn.disabled=true;
  try{
    let img;
    try{ img=await prepImage(file); }
    catch(e){ status("This browser can't open that picture format. iPhone photos are often HEIC: save the photo as JPEG or PNG first, or take it with the camera from inside the app."); return; }
    let w;
    try{ w=await getWorker(status); }
    catch(e){ console.error(e); ocrWorker=null; status("The label reader couldn't start in this browser ("+(e&&e.message||e)+")."); return; }
    status("Reading label…");
    const {data}=await w.recognize(img);
    const r=parseLabel(data.text);
    const filled=[];
    if(r.servingQty){ $("#sq").value=r.servingQty; $("#su").value=r.servingUnit; $("#su").onchange(); filled.push("serving size"); }
    if(r.servingGrams && UNITS[r.servingUnit||"g"].t!=="m"){ $("#sg").value=r.servingGrams; }
    for(const k of MAC) if(r[k]!=null){ $("#"+k).value=r[k]; filled.push(MACNAME[k].toLowerCase()); }
    st.innerHTML = (filled.length ? `Filled in ${filled.join(", ")}. <b>Please check them against the label.</b>`
      : `Couldn't find the numbers. Try a sharper, straight-on photo of just the Nutrition Facts panel.`)
      + `<details><summary>What the scanner read</summary><pre class="ocr">${esc(data.text)}</pre></details>`;
  }catch(e){ console.error(e); status("Something went wrong reading the label ("+(e&&e.message||e)+"). Please try again."); }
  finally{ btn.disabled=false; }
}
// Pulls serving size, calories and macros out of OCR text (US "Nutrition Facts" and EU "per 100 g" labels).
function parseLabel(raw){
  let t=raw.replace(/\r/g,"")
    .replace(/(\d)\s*[oO](?=\s*(m?g)\b)/g,"$10")          // "1Og" -> "10g"
    .replace(/\b[oO](?=\s*m?g\b)/g,"0")                  // "Og" -> "0g"
    .replace(/[|]/g,"l");
  const num=s=>s==null?null:+String(s).replace(",",".");
  const out={};
  const find=(res)=>{ for(const re of res){ const m=t.match(re); if(m) return m; } return null; };
  // Serving size, e.g. "Serving size 2/3 cup (55g)", "Serving Size 1 bar (40g)", "Serving size 30g"
  const sm=t.match(/serving\s*size[^\n\d]*([\d\s\/.,½¼¾⅓⅔]+)\s*([a-zA-Z.]+(?:\s?oz)?)?[^\n(]*\(?\s*(?:about\s*)?(\d+(?:[.,]\d+)?)?\s*(g|ml)?/i);
  if(sm){
    const q=sm[1].trim(), word=(sm[2]||"").toLowerCase().replace(/\.$/,"");
    let unit=null;
    if(/^cups?$/.test(word)) unit="cup"; else if(/^(tbsp|tablespoons?)$/.test(word)) unit="tbsp"; else if(/^(tsp|teaspoons?)$/.test(word)) unit="tsp";
    else if(/^fl\.? ?oz$/.test(word)) unit="floz"; else if(word==="oz") unit="oz"; else if(word==="ml") unit="ml"; else if(/^(g|grams?)$/.test(word)) unit="g";
    else if(word) unit="piece";
    let grams=num(sm[3]); if(sm[3] && !sm[4] && /\d9$/.test(sm[3])) grams=num(sm[3].slice(0,-1));
    if(unit==="g"||(unit==="ml"&&!grams)){ out.servingQty=q; out.servingUnit=unit; }
    else if(unit && !isNaN(parseQty(q))){ out.servingQty=q; out.servingUnit=unit; if(grams) out.servingGrams=grams; }
    else if(grams){ out.servingQty=String(grams); out.servingUnit=sm[4]==="ml"?"ml":"g"; }
  }
  if(!out.servingQty && /per\s*100\s*g/i.test(t)){ out.servingQty="100"; out.servingUnit="g"; }
  // OCR often reads the unit "g" as "9" ("37g" -> "379"). A grams value with no unit that ends in 9 is treated that way.
  const G="(\\d+(?:[.,]\\d+)?)\\s*(g|9|q)?(?![\\d.,])";
  const gram=m=>{ if(!m) return null; let v=m[1]; if(m[2]==="9"||m[2]==="q"||(!m[2] && /\d9$/.test(v))) v = m[2] ? v : v.slice(0,-1); return num(v); };
  const rx=(pre)=>new RegExp(pre+"[^\\d\\n]{0,8}"+G,"i");
  let m=find([/calories(?!\s*from)[^\d\n]{0,25}(\d{1,4})/i, /energy[^\n]*?(\d{1,4})\s*kcal/i, /(\d{1,4})\s*kcal/i]); if(m) out.kcal=num(m[1]);
  m=find([rx("total\\s*fat"), rx("\\bfat")]); if(m) out.fat=gram(m);
  m=find([rx("total\\s*carb[a-z.]*"), rx("carbohydrates?"), rx("carb[a-z.]*")]); if(m) out.carbs=gram(m);
  m=find([rx("protein")]); if(m) out.protein=gram(m);
  return out;
}

  ${usedBy.length?`<div class="card"><h3>Used as a sub-recipe in</h3>${usedBy.map(o=>esc(o.name)).join(", ")}</div>`:""}
  <div class="actions"><button class="btn ghost" id="dup">Duplicate</button><button class="btn danger" id="del">Delete recipe</button></div>
  <div id="err" class="err"></div>`;
  refreshSummary();
  const nm=$("#nm"); nm.oninput=()=>{ r.name=nm.value; save(); };
  nm.onblur=()=>{ if(!r.name.trim()){ r.name="Untitled recipe"; nm.value=r.name; save(); } };
  if(route.fresh){ route.fresh=false; nm.select(); }
  $("#sv").oninput=e=>{ const n=parseQty(e.target.value); r.servings=n>0?n:1; save(); refreshSummary(); };
  $("#fw").oninput=e=>{ const v=e.target.value.trim(), n=parseQty(v); r.finalWeight= v===""||!(n>0)?"":n; save(); refreshSummary(); };
  main.querySelectorAll("#vw button").forEach(b=>b.onclick=()=>{ pref.view=b.dataset.v; savePref(); refreshSummary(); });
  main.querySelectorAll("#items .line").forEach(l=>{
    const it=r.items[+l.dataset.i];
    l.querySelector(".qty").oninput=e=>{ it.qty=e.target.value.trim(); save(); refreshSummary(); };
    l.querySelector(".unit").onchange=e=>{ it.unit=e.target.value; save(); refreshSummary(); };
    l.querySelector(".rm").onclick=()=>{ r.items.splice(+l.dataset.i,1); save(); renderRecipe(); };
  });
  $("#addItem").onclick=()=>openPicker(r);
  $("#plan").onclick=()=>openPlanDialog(r.id); bindFav(r, renderRecipe); bindPhotoNotes(r, renderRecipe);
  $("#dup").onclick=()=>{ const c=JSON.parse(JSON.stringify(r)); c.id=uid(); c.name=r.name+" (copy)"; db.recipes.push(c); save(); toast("Duplicated"); go({tab:"recipes",id:c.id}); };
  $("#del").onclick=()=>{
    if(usedBy.length) return $("#err").textContent=`It's a sub-recipe in ${usedBy.map(o=>o.name).join(", ")}. Remove it there first.`;
    const planned=db.plan.entries.some(e=>e.recipeId===r.id);
    if(!confirm(`Delete ${r.name}?${planned?" It will also be removed from your meal plan.":""}`)) return;
    (r.photos||[]).forEach(delPhoto); db.recipes=db.recipes.filter(o=>o.id!==r.id); db.plan.entries=db.plan.entries.filter(e=>e.recipeId!==r.id); save(); go({tab:"recipes"});
  };
}
function refreshSummary(){
  const r=rec(route.id), t=totals(r.id), s=Number(r.servings)||1;
  const scale= pref.view==="total"?1 : pref.view==="g100"?(t.weight?100/t.weight:0) : 1/s;
  $("#mb").innerHTML=macroBlock(t.total, scale);
  { const c=costOf(flatten(r.id,1,{}));
    $("#cost").textContent = c.priced ? `Cost ${money(c.total)} for the recipe${s!==1?` · ${money(c.total/s)} per serving`:""}${c.missing.length?` (not priced: ${c.missing.join(", ")})`:""}` : ""; }
  $("#wt").textContent=`Total weight ${fmt(t.weight)} g${s!==1?` · one serving ≈ ${fmt(t.weight/s)} g`:""}`;
  $("#bad").textContent= t.bad==="unit" ? "An item uses a unit its ingredient can't convert (add a cup or piece weight to that ingredient)." : t.bad ? "Some items point to something that was deleted." : "";
  main.querySelectorAll("#vw button").forEach(b=>b.classList.toggle("on", b.dataset.v===pref.view));
  main.querySelectorAll("#items .line").forEach(l=>{ const i=itemInfo(r.items[+l.dataset.i]);
    l.querySelector(".sub").textContent= i.bad==="unit" ? "Can't convert this unit for this ingredient" : `${short(i.m)}${i.grams?` · ${fmt(i.grams)} g`:""}`; });
  $("#fw").placeholder=fmt(t.rawWeight||0);
}
function itemRow(it,i){
  const isRec=it.kind==="rec", obj=isRec?rec(it.id):ing(it.id);
  const name=obj?(isRec?esc(obj.name):ingHtml(obj)):"<i>(deleted)</i>";
  let list = isRec ? ["serving","batch","g","oz","lb"] : unitsFor(obj);
  if(!list.includes(it.unit)) list=[it.unit, ...list];
  return `<div class="line wrap" data-i="${i}"><div class="grow"><div>${name}${isRec?`<span class="tag">recipe</span>`:""}</div>
    <div class="sub"></div></div>
    <input class="qty" inputmode="text" value="${esc(it.qty)}" aria-label="Quantity">
    <select class="unit" aria-label="Unit">${unitOptions(list, it.unit)}</select>
    <button class="btn danger small rm" aria-label="Remove">✕</button></div>`;
}

/* ---------- Picker ---------- */
let pick={kind:"ing",recipe:null};
function openPicker(r){ pick.recipe=r; $("#pickSearch").value=""; drawPicker(); $("#picker").showModal(); }
function drawPicker(){
  const r=pick.recipe, q=$("#pickSearch").value.toLowerCase();
  document.querySelectorAll("#pickSeg button").forEach(b=>b.classList.toggle("on", b.dataset.k===pick.kind));
  let rows;
  if(pick.kind==="ing"){
    rows=db.ingredients.filter(x=>ingMatch(x,q)).sort(favFirst)
      .map(x=>`<button class="item" data-id="${x.id}"><div class="grow"><div class="name">${ingHtml(x)}</div><div class="sub">per ${esc(servingText(x))}: ${short(add(zero(),x.per,x.serving.grams))}</div></div><span>＋</span></button>`);
    if(!db.ingredients.length) rows=[`<div class="empty">No ingredients yet. Add some in the Ingredients tab.</div>`];
  } else {
    rows=db.recipes.filter(x=>x.id!==r.id&&x.name.toLowerCase().includes(q)).sort(byName).map(x=>{ const ok=canNest(r.id,x.id);
      return `<button class="item" data-id="${x.id}" ${ok?"":"disabled style='opacity:.45'"}><div class="grow"><div class="name">${esc(x.name)}</div>
        <div class="sub">${ok?"whole recipe: "+short(totals(x.id).total):"Can't add: it already uses "+esc(r.name)}</div></div><span>${ok?"＋":""}</span></button>`; });
    if(!rows.length) rows=[`<div class="empty">No other recipes yet.</div>`];
  }
  $("#pickList").innerHTML=rows.join("");
  $("#pickList").querySelectorAll("button.item:not([disabled])").forEach(b=>b.onclick=()=>{
    if(pick.kind==="rec"&&!canNest(r.id,b.dataset.id)) return;
    if(pick.kind==="ing"){ const x=ing(b.dataset.id); const su=x.serving.unit;
      r.items.push({kind:"ing", id:x.id, qty: UNITS[su].t==="m" ? "100" : "1", unit: UNITS[su].t==="m" ? "g" : su}); }
    else r.items.push({kind:"rec", id:b.dataset.id, qty:"1", unit:"serving"});
    save(); $("#picker").close(); renderRecipe();
    const inputs=main.querySelectorAll("input.qty"); const last=inputs[inputs.length-1]; if(last){ last.focus(); last.select(); }
  });
}
$("#pickSearch").oninput=drawPicker;
document.querySelectorAll("#pickSeg button").forEach(b=>b.onclick=()=>{ pick.kind=b.dataset.k; drawPicker(); });

/* =========================================================
   Backup
   ========================================================= */
function setTheme(t){ pref.theme=t; savePref(); if(t==="dark") document.documentElement.dataset.theme="dark"; else delete document.documentElement.dataset.theme;
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content = t==="dark" ? "#111113" : "#f6f5f2"; }
function renderSettings(){
  setHeader("Settings");
  const last=getNum("-backup"), dark=pref.theme==="dark";
  main.innerHTML=`<div class="card"><h3>Appearance</h3>
    <div class="seg" id="thm" style="margin:0"><button data-t="light" class="${dark?"":"on"}">☀️ Light</button><button data-t="dark" class="${dark?"on":""}">🌙 Dark</button></div></div>
    <div class="card"><h3>Your data</h3>
    <p>${db.ingredients.length} ingredients · ${db.recipes.length} recipes · ${db.plan.entries.length} planned meals.</p>
    <p class="sub">Last backup: <b>${last?new Date(last).toLocaleString():"never"}</b></p>
    <div class="actions" style="justify-content:flex-start">
      <button class="btn" id="exp">Back up now</button><button class="btn ghost" id="imp">Restore from backup</button>${(()=>{ try{ return localStorage.getItem(KEY+"-undo")?`<button class="btn ghost" id="undoRs">Undo last restore</button>`:""; }catch(e){ return ""; } })()}</div>
    <p class="hint">Back up saves a file. On iPhone choose <b>Save to Files</b> then <b>iCloud Drive</b>; on Android save it to <b>Google Drive</b> or Downloads. Restore replaces what is on this device.</p></div>
    <div class="card"><h3>What keeps your data safe</h3>
    <p class="sub" style="margin:0 0 6px">✅ <b>App updates never erase your data.</b> New versions arrive by themselves the next time you open the app online. You don't need to download anything again.</p>
    <p class="sub" style="margin:0 0 6px">⚠️ <b>Deleting the home-screen icon deletes the data</b> stored in it (that's how phones handle home-screen web apps). Back up first, then use Restore after re-adding it.</p>
    <p class="sub" style="margin:0">ℹ️ The app on your home screen and the same page open in the browser keep separate data. Use the home-screen app.</p>
    <p class="hint" id="pst"></p></div>`;
  main.querySelectorAll("#thm button").forEach(b=>b.onclick=()=>{ setTheme(b.dataset.t); renderSettings(); });
  $("#exp").onclick=async()=>{ if(await doExport()) renderSettings(); };
  $("#imp").onclick=()=>pickRestore();
  if($("#undoRs")) $("#undoRs").onclick=()=>{ try{ const u=JSON.parse(localStorage.getItem(KEY+"-undo")); if(!confirm(`Go back to the data from before the last restore (${u.ingredients.length} ingredients, ${u.recipes.length} recipes)?`)) return;
    db=migrate(u); save(); localStorage.removeItem(KEY+"-undo"); toast("Restore undone"); renderSettings(); }catch(e){ toast("Nothing to undo"); } };
  if(navigator.storage&&navigator.storage.persisted) navigator.storage.persisted().then(p=>{ const el=$("#pst"); if(el) el.textContent=p?"Storage is marked as protected on this device.":""; }).catch(()=>{});
}

try{ snapToday(); localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
render();
// Ask the browser to protect this app's storage from automatic clean-up.
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
if("serviceWorker" in navigator && window.isSecureContext && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
